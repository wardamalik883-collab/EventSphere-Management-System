# EventSphere Management — Render Blueprint Specification
# Infrastructure as Code for deploying both Express API and React Client on Render

services:
  # ── Backend Web Service (Node.js / Express API) ──────────────────────────────
  - type: web
    name: eventsphere-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false # Set securely in Render Dashboard (MongoDB Atlas URI)
      - key: JWT_SECRET
        generateValue: true # Render will generate a cryptographically strong 256-bit secret
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: CLIENT_ORIGIN
        sync: false # Set to your deployed frontend URL (e.g. https://eventsphere.vercel.app)
      - key: MAX_FILE_SIZE_MB
        value: 5
      - key: REMINDER_WINDOW_HOURS
        value: 24
    healthCheckPath: /api/health
    autoDeploy: true

  # ── Frontend Static Site (React Client) ──────────────────────────────────────
  - type: web
    name: eventsphere-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: CI
        value: "false"
      - key: REACT_APP_API_URL
        sync: false # Set to https://eventsphere-api.onrender.com (no trailing slash)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
